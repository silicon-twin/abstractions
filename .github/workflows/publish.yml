name: Publish NuGet

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    # Trusted Publishing (OIDC): exchange a short-lived GitHub token for a NuGet
    # API key, no long-lived NUGET_API_KEY secret. Requires id-token: write.
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' src/SiliconTwin.Abstractions/SiliconTwin.Abstractions.csproj)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match <Version>$PKG_VERSION</Version>"
            exit 1
          fi

      - name: Restore
        run: dotnet restore SiliconTwin.Abstractions.sln

      - name: Build
        run: dotnet build SiliconTwin.Abstractions.sln -c Release --no-restore /p:ContinuousIntegrationBuild=true

      - name: Test
        run: dotnet test SiliconTwin.Abstractions.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Pack
        run: >
          dotnet pack src/SiliconTwin.Abstractions/SiliconTwin.Abstractions.csproj
          -c Release
          --no-build
          --output ./nupkgs

      # Exchanges the workflow's OIDC token for a short-lived nuget.org API key.
      # A trusted-publishing policy (owner + repo + workflow file) must exist on
      # nuget.org, and the account username is provided via the NUGET_USER repo variable.
      - name: NuGet login (Trusted Publishing)
        id: nuget_login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        run: >
          dotnet nuget push "./nupkgs/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}"
          --skip-duplicate

      - name: Upload NuGet Packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/*
          retention-days: 14
          if-no-files-found: error
